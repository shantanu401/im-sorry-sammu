<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sammu, I'm Sorry ❤️</title>

<style>
body {
    font-family: 'Segoe UI', sans-serif;
    margin: 0;
    padding: 15px;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
}

.container {
    max-width: 520px;
    width: 100%;
    margin: auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    padding: 20px 18px;
    text-align: center;
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from {opacity: 0; transform: translateY(20px);}
    to {opacity: 1; transform: translateY(0);}
}

.top-image {
    width: 100%;
    max-width: 230px;
    border-radius: 20px;
    margin-bottom: 18px;
}

.title {
    color: #e91e63;
    font-size: 1.4rem;
    font-weight: bold;
}

.desc {
    font-size: 1rem;
    color: #444;
    line-height: 1.6;
    margin: 8px 0;
}

/* 🔥 FINAL BUTTON */
.btn {
    display: block;
    margin: 18px auto;
    padding: 16px 22px;
    background: #e91e63;
    color: white;
    border: none;
    border-radius: 30px;
    font-size: 1.1rem;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    box-shadow: 0 8px 20px rgba(233, 30, 99, 0.4);
    transition: all 0.2s ease;
}

.btn:hover {
    background: #c2185b;
    transform: translateY(-2px);
}

.btn:active {
    transform: scale(0.95);
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.heart {
    font-size: 28px;
    animation: heartbeat 1.2s infinite;
}

@keyframes heartbeat {
    0% { transform: scale(1); }
    25% { transform: scale(1.2); }
    50% { transform: scale(1); }
    75% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

video {
    width: 100%;
    margin-top: 20px;
    border-radius: 12px;
}

@media (max-width: 480px) {
    .title { font-size: 1.2rem; }
    .desc { font-size: 0.95rem; }
}
</style>
</head>

<body>

<div class="container">
    <img src="cat_apology.jpeg" class="top-image">

    <p class="title">Sammu, I messed up... I'm really sorry ❤️</p>

    <p class="desc" style="color:#e91e63; font-weight:500;">
        Sammu… please don’t leave me like this.
    </p>

    <!-- ✅ MAIN CLICK BUTTON -->
    <button class="btn" onclick="startMusic()">
        Please Forgive Me
    </button>

    <p class="desc">
        I know I hurt you, and I hate that I did.<br>
        Honestly... I feel terrible about it.
    </p>

    <p class="desc">
        It feels empty without talking to you.<br>
        You're not just important… you're <b>everything</b> to me.
    </p>

    <p class="desc">
        I miss you. A lot. 🥺
    </p>

    <div class="heart">❤️</div>

    <video controls autoplay loop>
        <source src="cat-please.mp4" type="video/mp4">
    </video>
</div>

<!-- 🎵 MUSIC -->
<audio id="bgMusic" loop>
    <source src="dekho-dekho-muze-chod-na-dena.mp3" type="audio/mpeg">
</audio>

<script>
function startMusic() {
    document.getElementById("bgMusic").play();
}
</script>

</body>
</html>
